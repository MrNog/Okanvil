name: Package addon

# On every push to main, build one clean install-ready <Addon>.zip per top-level
# folder that contains a .toc (currently just "Okanvil"). The zip holds a folder
# named exactly after the addon, so users just unzip it straight into AddOns\.
# Dev-only files (README, PLAN, docs, backups, skills) are STRIPPED from the zip
# so the download is nothing but the addon itself.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build install-ready zip(s) (only folders with a .toc)
        run: |
          mkdir -p out
          for d in */ ; do
            name="${d%/}"
            if ls "$name"/*.toc >/dev/null 2>&1; then
              mkdir -p "staging/$name"
              cp -r "$name/." "staging/$name/"
              # strip dev-only files so the download is JUST the addon
              ( cd "staging/$name" && \
                rm -f README.md PLAN.md CHANGELOG.md .editorconfig && \
                find . -type d -name '.git' -prune -exec rm -rf {} + && \
                find . -type d -name '.github' -prune -exec rm -rf {} + && \
                find . -type d -name '.claude' -prune -exec rm -rf {} + && \
                rm -f Media/README.md && \
                rm -f Media/*.png && \
                find . -name '*.bak' -delete && \
                find . -name '*~' -delete )
              ( cd staging && zip -r "../out/$name.zip" "$name" )
              echo "packaged $name (dev files stripped)"
            fi
          done

      - name: Publish / refresh the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # wipe the old rolling release + its tag, then recreate it with the fresh zips attached
          # in one go — no pre-existing assets to collide with (fixes "ReleaseAsset already exists")
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest --title "Latest" --latest \
            --notes "Latest build of Okanvil. Download Okanvil.zip and unzip it into World of Warcraft\\Interface\\AddOns\\, then restart WoW." \
            out/*.zip
