name: Announce release to Discord

# Posts a card to Discord whenever a VERSIONED release is published.
#
# Fires on the release event (no cron, no polling, no state file) -- GitHub tells
# us the moment `package.yml` publishes the tagged release, so there is nothing
# to miss and nothing to seed.
#
# The rolling "Latest" release is REPUBLISHED on every push to main, so we skip
# it: only real `vX.Y.Z` tags are announced.
#
# SETUP (one time):
#   GitHub -> the Okanvil repo -> Settings -> Secrets and variables -> Actions
#   -> New repository secret -> Name: LOG_WEBHOOK   Value: <the #okanor-logs webhook URL>
#
# LOG_WEBHOOK is the SAME name the rats repo uses for this webhook ("Logs" /
# #okanor-logs), so there is one secret name for one Discord channel. Each repo
# still needs its own copy of the secret -- GitHub secrets don't cross repos.

on:
  release:
    types: [published]
  workflow_dispatch:            # lets you re-post the newest release by hand
    inputs:
      tag:
        description: "Tag to announce (e.g. v1.0.1). Blank = latest release."
        required: false

jobs:
  announce:
    runs-on: ubuntu-latest
    # skip the rolling "latest" pointer; only announce real version tags
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'latest'
    steps:
      - uses: actions/checkout@v4      # needed for `gh release view` on dispatch

      - name: Resolve the release to announce
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          # pass event data through the ENV, never interpolated into the script --
          # release notes can contain backticks / ${...} that would break the shell
          EV_NAME: ${{ github.event_name }}
          EV_TAG:  ${{ github.event.release.tag_name }}
          EV_URL:  ${{ github.event.release.html_url }}
          EV_BODY: ${{ github.event.release.body }}
          IN_TAG:  ${{ inputs.tag }}
        run: |
          set -e
          if [ "$EV_NAME" = "release" ]; then
            TAG="$EV_TAG"; URL="$EV_URL"
            printf '%s' "$EV_BODY" > notes.raw
          else
            TAG="$IN_TAG"
            [ -z "$TAG" ] && TAG=$(gh release view --json tagName -q .tagName)
            URL=$(gh release view "$TAG" --json url -q .url)
            gh release view "$TAG" --json body -q .body > notes.raw
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # trim to stay inside Discord's 4096-char embed description budget
          head -c 1500 notes.raw > notes.txt
          echo "Announcing $TAG"

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.LOG_WEBHOOK }}   # the #okanor-logs webhook
          TAG: ${{ steps.rel.outputs.tag }}
          URL: ${{ steps.rel.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if [ -z "$WEBHOOK" ]; then
            echo "::error::LOG_WEBHOOK secret is not set. Add it in Settings -> Secrets and variables -> Actions (value = the #okanor-logs webhook URL)."
            exit 1
          fi
          NOTES=$(cat notes.txt)
          ZIP="https://github.com/$REPO/releases/download/$TAG/Okanvil.zip"
          DESC=$(printf '%s\n\n**Install:** unzip into `World of Warcraft\\Interface\\AddOns\\`, then restart WoW.\n[Download Okanvil.zip](%s) | [Release notes](%s)' "$NOTES" "$ZIP" "$URL")

          # 12686394 = #c1943a, the RATS gold
          payload=$(jq -n \
            --arg t "Okanvil $TAG" \
            --arg u "$URL" \
            --arg d "$DESC" \
            --arg f "$REPO" \
            '{embeds:[{
               author:{name:"Okanvil - new release"},
               title:$t, url:$u, description:$d,
               color:12686394,
               footer:{text:$f}
             }]}')

          code=$(curl -s -o /dev/null -w "%{http_code}" \
                 -H "Content-Type: application/json" -d "$payload" "$WEBHOOK")
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Announced $TAG to Discord (HTTP $code)"
          else
            echo "::error::Discord webhook failed (HTTP $code)"
            exit 1
          fi
